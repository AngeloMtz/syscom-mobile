name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  analisis-estatico:
    name: Análisis estático
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Análisis estático (ESLint)
        run: npx expo lint

      - name: Verificación de tipos (TypeScript)
        run: npx tsc --noEmit

      - name: Auditoría de seguridad (bloquea con vulnerabilidades críticas)
        run: npm audit --audit-level=critical

      - name: Auditoría de seguridad (informativa, nivel alto)
        run: npm audit --audit-level=high
        continue-on-error: true

  pruebas-unitarias:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas unitarias (Jest)
        run: npx jest --ci --coverage
